name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build, coverage, and local E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - name: Build frontend
        run: npm run build

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated emulator smoke suite
        run: npm run test:weekly:qa

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airabook-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
